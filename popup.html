<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>IG Downloader</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <div class="wrap">
    <h1>Instagram Downloader</h1>
    <div id="info" class="info">Click <strong>Fetch media</strong> while on an Instagram page.</div>
    <div class="controls">
      <button id="fetchBtn">Fetch media</button>
      <button id="downloadAllBtn" disabled>Download all</button>
    </div>
    <ul id="mediaList" class="media-list"></ul>
    <div id="noMedia" class="empty">No media found.</div>
    <div class="legal">This extension does not bypass Instagram privacy.</div>
  </div>
  <script src="popup.js"></script>
</body>
</html>
